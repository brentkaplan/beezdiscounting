url: https://brentkaplan.github.io/beezdiscounting/

llm-docs: true

template:
  bootstrap: 5
  light-switch: true
  math-rendering: katex
  bslib:
    bg: "#FFFFFF"
    fg: "#1E3242"
    primary: "#2B4560"
    secondary: "#A25F5F"
    success: "#7D9C7F"
    info: "#5D8AA8"
    base_font:
      google: "Open Sans"
    heading_font:
      google: "Open Sans"
    code_font:
      google: "Fira Mono"

home:
  title: beezdiscounting - Behavioral Economic Discounting Analysis
  description: >
    R package for behavioral economic discounting analysis. Scores delay and
    probability discounting tasks, fits hyperbolic and exponential discount
    functions, scores the 27- and 21-item Monetary Choice Questionnaire (MCQ)
    and the 30-item Probability Discounting Questionnaire (PDQ), computes
    AUC and systematicity measures, and fits TMB-based SLT-beta mixed-effects
    discounting models for bounded indifference-point data.
  strip_header: false

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github, lightswitch]
  components:
    articles:
      text: Articles
      menu:
        - text: Getting started
        - text: Scoring the 27-item MCQ
          href: articles/mcq27-scoring.html
        - text: Scoring the Probability Discounting Questionnaire
          href: articles/pdq-scoring.html
        - text: Indifference points, k, and AUC
          href: articles/delay-discounting-basics.html
        - text: The 5.5-trial task
          href: articles/fivetrial-task.html
        - text: ---
        - text: Modeling
        - text: Mixed-effects discounting (TMB)
          href: articles/tmb-mixed-effects.html
        - text: Discounting from trial-level choices
          href: articles/choice-discounting.html
        - text: Bounded error distributions (SLT-beta)
          href: articles/sltb-discounting.html
        - text: Bayesian models (brms)
          href: articles/bayesian-discounting.html
        - text: Comparing discounting rates between groups
          href: articles/dd-group-comparisons.html
        - text: ---
        - text: Study planning
        - text: Power analysis
          href: articles/power-analysis.html

reference:
  - title: Mixed-effects discounting (TMB)
    desc: >
      Fit SLT-beta mixed-effects discounting models to bounded
      indifference-point data using TMB, and simulate from the same model.
    contents:
      - fit_dd_tmb
      - simulate_dd_ip
      - VarCorr.beezdiscounting_tmb

  - title: Power analysis
    desc: >
      Monte Carlo power estimation and sample-size search for between-subject
      discounting designs.
    contents:
      - power_discounting
      - find_n_discounting

  - title: Choice-based discounting (TMB)
    desc: >
      Fit the structural or descriptive (Young 2018) SS-vs-LL choice model — a
      binomial GLMM — and simulate from either model. The descriptive mode adds
      a VarCorr method for the random-effect covariance.
    contents:
      - fit_dd_choice
      - simulate_dd_choice
      - VarCorr.beezdiscounting_choice

  - title: Bayesian discounting (brms)
    desc: >
      Bayesian mixed-effects discounting via brms/Stan: the
      indifference-point and structural-choice fitters with their default
      priors.
    contents:
      - fit_dd_brms
      - fit_dd_choice_brms
      - default_dd_priors
      - default_dd_choice_priors

  - title: Estimated marginal means & comparisons
    desc: >
      Post-hoc estimated marginal means and pairwise comparisons for fitted
      mixed-effects discounting models.
    contents:
      - get_dd_param_emms
      - get_dd_comparisons

  - title: Model inspection (S3 methods)
    desc: S3 methods for extracting information from fitted models.
    contents:
      - starts_with("tidy")
      - starts_with("glance")
      - starts_with("augment")
      - starts_with("predict.")
      - starts_with("confint.")
      - starts_with("summary.")
      - starts_with("coef")
      - starts_with("fixef")
      - starts_with("ranef")
      - starts_with("AIC.")
      - starts_with("BIC.")
      - starts_with("logLik.")
      - starts_with("nobs.")
      - starts_with("fitted.")
      - starts_with("residuals.")
      - starts_with("print.")

  - title: Delay discounting (NLS / scoring)
    desc: >
      Fit hyperbolic/exponential discount functions via nonlinear regression
      and score delay-discounting tasks.
    contents:
      - fit_dd
      - results_dd
      - plot_dd
      - calc_dd
      - score_dd
      - ans_dd
      - timing_dd

  - title: Probability discounting
    desc: Scoring functions for probability-discounting tasks.
    contents:
      - calc_pd
      - score_pd
      - ans_pd
      - timing_pd

  - title: Probability Discounting Questionnaire (PDQ)
    desc: >
      Scoring, lookup, and reshaping for the 30-item PDQ (Madden, Petry, &
      Johnson, 2009), scored per block with the Gray et al. (2016)
      consistency-maximization conventions.
    contents:
      - score_pdq
      - prop_sc
      - pdq_to_choice

  - title: Monetary Choice Questionnaire (MCQ, 27- and 21-item)
    desc: >
      Scoring, lookup, simulation, and reshaping for the 27-item (Kirby,
      Petry, & Bickel, 1999) and 21-item (Kirby & Marakovic, 1996) MCQ.
    contents:
      - score_mcq
      - score_mcq27
      - summarize_mcq
      - prop_ss
      - get_lookup_table
      - mcq_to_choice
      - mcq27_to_choice
      - generate_data_mcq
      - wide_to_long_mcq
      - long_to_wide_mcq
      - wide_to_long_mcq_excel
      - long_to_wide_mcq_excel

  - title: Utilities & metrics
    desc: Area under the curve, fit metrics, and systematicity checks.
    contents:
      - calc_aucs
      - calc_r2
      - calc_conf_int
      - check_unsystematic

  - title: Visualization
    desc: >
      Plot methods for fitted discounting models -- discount curves, Bayesian
      posterior bands, group-comparison forest plots, and random-effect QQ
      diagnostics -- plus plotting for scored task outputs.
    contents:
      - starts_with("plot.")
      - plot_qq.beezdiscounting

  - title: Datasets
    desc: Built-in datasets for examples and testing.
    contents:
      - dd_ip
      - mcq27
      - mcq21
      - pdq
      - five.fivetrial_dd
      - five.fivetrial_pd

  - title: Reexports
    desc: Generics re-exported from other packages.
    contents:
      - reexports
      - "%>%"

  - title: internal
    desc: Documented internal helpers (not exported).
    contents:
      - inn
      - score_one_mcq27
      - score_one_pdq

authors:
  Brent Kaplan:
    href: https://github.com/brentkaplan
